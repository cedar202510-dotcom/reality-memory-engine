services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rme-postgres
    environment:
      POSTGRES_DB: rme
      POSTGRES_USER: rme
      POSTGRES_PASSWORD: rme
    ports:
      - "5432:5432"
    volumes:
      - rme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rme -d rme"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  rme-pgdata:
