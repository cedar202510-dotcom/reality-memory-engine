<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reality Agent 首页概念 v0.9</title>
  <style>
    :root {
      --page: #edf1ee;
      --ink: #f2fff5;
      --muted: rgba(242,255,245,.62);
      --green: #56eb8e;
      --aqua: #4eb2cc;
      --warm: #da924b;
      --bar: rgba(248,255,250,.13);
      --bar-line: rgba(248,255,250,.18);
      --shadow: 0 34px 92px rgba(14,29,23,.34);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      letter-spacing: 0;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 16% 12%, rgba(86,235,142,.15), transparent 30%),
        radial-gradient(circle at 84% 18%, rgba(78,178,204,.11), transparent 29%),
        linear-gradient(180deg, #fbfbf7 0%, var(--page) 54%, #dfe8e1 100%);
    }

    button { font: inherit; color: inherit; cursor: pointer; }

    .stage {
      width: min(1240px, 100%);
      padding: 28px clamp(14px, 4vw, 48px) 48px;
      display: grid;
      grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
      gap: clamp(24px, 5vw, 58px);
      align-items: center;
    }

    .phone {
      width: min(430px, 100%);
      margin: 0 auto;
      aspect-ratio: 390 / 844;
      padding: 10px;
      border-radius: 38px;
      background: #101612;
      box-shadow: var(--shadow);
    }

    .screen {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 30px;
      background:
        radial-gradient(circle at 45% 38%, rgba(97,226,148,.34), transparent 18%),
        radial-gradient(circle at 66% 61%, rgba(96,180,200,.22), transparent 24%),
        radial-gradient(circle at 35% 74%, rgba(193,131,67,.16), transparent 24%),
        linear-gradient(150deg, #0e1d17 0%, #203a30 52%, #101b17 100%);
    }

    .status {
      position: relative;
      z-index: 5;
      height: 36px;
      padding: 10px 18px 0;
      display: flex;
      justify-content: space-between;
      color: rgba(248,255,250,.78);
      font-size: 11px;
      font-weight: 760;
      text-shadow: 0 1px 12px rgba(0,0,0,.32);
    }

    .top {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 24px 24px 0;
    }

    .brand b,
    .brand span {
      display: block;
    }

    .brand b {
      font-size: 22px;
      line-height: 1;
      font-weight: 760;
    }

    .brand span {
      max-width: 250px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .enabled {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(248,255,250,.14);
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
    }

    .enabled::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(86,235,142,.11), 0 0 18px rgba(86,235,142,.55);
    }

    .light-field {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .beam {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 45% 55% 52% 48%;
      filter: blur(10px);
      opacity: .58;
      mix-blend-mode: screen;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .beam.one {
      left: -60px;
      top: 110px;
      background: radial-gradient(circle, rgba(86,235,142,.72), transparent 64%);
    }

    .beam.two {
      right: -80px;
      top: 190px;
      background: radial-gradient(circle, rgba(78,178,204,.58), transparent 66%);
      animation-delay: -3s;
    }

    .beam.three {
      left: 70px;
      bottom: 18px;
      background: radial-gradient(circle, rgba(218,146,75,.36), transparent 66%);
      animation-delay: -6s;
    }

    @keyframes drift {
      0% { transform: translate3d(-8px, 10px, 0) rotate(0deg) scale(.95); }
      100% { transform: translate3d(16px, -18px, 0) rotate(18deg) scale(1.08); }
    }

    .orb-wrap {
      position: absolute;
      left: 50%;
      top: 43%;
      width: 108px;
      height: 108px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      animation: tremble 5.4s ease-in-out infinite;
    }

    .orb-wrap::before,
    .orb-wrap::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 49% 51% 52% 48%;
      background: radial-gradient(circle, rgba(255,255,255,.11), transparent 64%);
      filter: blur(3px);
      opacity: .55;
      animation: edgeWave 4.8s ease-in-out infinite;
    }

    .orb-wrap::after {
      inset: -13px;
      border-radius: 53% 47% 48% 52%;
      opacity: .28;
      animation-delay: -1.6s;
    }

    .orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 54% 58%, rgba(86,235,142,.18), transparent 38%),
        radial-gradient(circle, rgba(255,255,255,.09), rgba(255,255,255,.06) 56%, transparent 72%);
      box-shadow:
        0 0 34px rgba(94,231,145,.22),
        inset 0 0 31px rgba(255,255,255,.07);
      backdrop-filter: blur(12px);
      animation: orbBreath 4.7s ease-in-out infinite;
    }

    @keyframes tremble {
      0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      25% { transform: translate(calc(-50% + 1px), calc(-50% - 1px)) scale(1.012) rotate(.8deg); }
      50% { transform: translate(calc(-50% - 1px), calc(-50% + .5px)) scale(.992) rotate(-.6deg); }
      75% { transform: translate(calc(-50% + .5px), calc(-50% + 1px)) scale(1.006) rotate(.4deg); }
    }

    @keyframes edgeWave {
      0%, 100% { transform: scale(.98) rotate(0deg); border-radius: 49% 51% 52% 48%; opacity: .36; }
      50% { transform: scale(1.04) rotate(7deg); border-radius: 54% 46% 49% 51%; opacity: .68; }
    }

    @keyframes orbBreath {
      0%, 100% { opacity: .86; transform: scale(.985); }
      50% { opacity: 1; transform: scale(1.025); }
    }

    .ring {
      position: absolute;
      left: 50%;
      top: 43%;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 4.8s ease-in-out infinite;
    }

    .ring.r1 { width: 176px; height: 176px; }
    .ring.r2 { width: 242px; height: 242px; animation-delay: .65s; }
    .ring.r3 { width: 306px; height: 306px; animation-delay: 1.3s; }

    @keyframes pulse {
      0%, 100% { opacity: .24; transform: translate(-50%, -50%) scale(.97); }
      50% { opacity: .62; transform: translate(-50%, -50%) scale(1.035); }
    }

    .hint {
      position: absolute;
      left: 26px;
      right: 26px;
      bottom: 145px;
      z-index: 5;
      min-height: 24px;
      text-align: center;
      color: rgba(248,255,250,.82);
      font-size: 13px;
      font-weight: 690;
    }

    .composer {
      position: absolute;
      left: 50%;
      bottom: 28px;
      z-index: 5;
      width: min(300px, calc(100% - 58px));
      height: 54px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
    }

    .voice {
      height: 54px;
      border: 1px solid var(--bar-line);
      border-radius: 19px;
      background: var(--bar);
      color: rgba(248,255,250,.88);
      font-size: 15px;
      font-weight: 720;
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 38px rgba(0,0,0,.16), inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .text-toggle {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(248,255,250,.13);
      border-radius: 50%;
      background: rgba(248,255,250,.09);
      color: rgba(248,255,250,.78);
      backdrop-filter: blur(14px);
    }

    .text-toggle::before {
      content: "";
      width: 16px;
      height: 13px;
      border: 1.8px solid currentColor;
      border-radius: 3px;
      box-shadow:
        -5px 6px 0 -4px currentColor,
        5px 6px 0 -4px currentColor;
    }

    .notes {
      display: grid;
      gap: 16px;
    }

    .card {
      padding: 22px;
      border: 1px solid rgba(17,29,24,.12);
      border-radius: 24px;
      background: rgba(255,255,255,.72);
      color: #111d18;
      box-shadow: 0 24px 78px rgba(17,29,24,.12);
    }

    .card h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.22;
    }

    .card p {
      margin: 9px 0 0;
      color: #647168;
      font-size: 14px;
      line-height: 1.72;
    }

    .fixes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .fix {
      min-height: 112px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(247,249,245,.9);
      border: 1px solid rgba(17,29,24,.08);
    }

    .fix b,
    .fix span {
      display: block;
    }

    .fix b { font-size: 13px; }

    .fix span {
      margin-top: 7px;
      color: #647168;
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 980px) {
      .stage { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .stage { padding: 18px 12px 36px; }
      .phone { padding: 8px; border-radius: 30px; }
      .screen { border-radius: 24px; }
      .fixes { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="Agent 首页概念 v0.9">
      <div class="screen">
        <div class="light-field" aria-hidden="true">
          <i class="beam one"></i>
          <i class="beam two"></i>
          <i class="beam three"></i>
          <i class="ring r1"></i>
          <i class="ring r2"></i>
          <i class="ring r3"></i>
          <span class="orb-wrap"><i class="orb"></i></span>
        </div>

        <div class="status"><span>9:41</span><span>Reality</span></div>

        <header class="top">
          <div class="brand">
            <b>在场</b>
            <span>随时待命的现实记忆 Agent。</span>
          </div>
          <i class="enabled" aria-label="已开启"></i>
        </header>

        <div class="hint">2 条线索待确认</div>

        <div class="composer" role="group" aria-label="语音输入">
          <button class="voice">按住说话</button>
          <button class="text-toggle" aria-label="切换文字输入"></button>
        </div>
      </div>
    </section>

    <aside class="notes">
      <article class="card">
        <h2>v0.9 缩小光球，软化边缘</h2>
        <p>去掉中心点之后，v0.8 的球体确实显得太大、边缘太实。v0.9 把球体缩小，并把边缘改成柔和渐隐的波动边，而不是一个硬圆。</p>
      </article>
      <article class="card">
        <h2>动效调整</h2>
        <p>不再只是整圈放大缩小，而是增加了轻微震荡和边缘波动，让它看起来像在呼吸，而不是一个静止玻璃按钮。</p>
        <div class="fixes">
          <div class="fix"><b>尺寸</b><span>中心球从 136px 缩到 108px。</span></div>
          <div class="fix"><b>边缘</b><span>去掉硬边，用模糊渐隐和轻微形变表达生命感。</span></div>
          <div class="fix"><b>外圈</b><span>呼吸环同步缩小，避免压迫感。</span></div>
          <div class="fix"><b>动效</b><span>增加 1px 级别震荡和边缘轻微波动。</span></div>
        </div>
      </article>
    </aside>
  </main>
</body>
</html>
