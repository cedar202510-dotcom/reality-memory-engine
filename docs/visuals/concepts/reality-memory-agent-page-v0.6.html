<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reality Agent 首页概念 v0.6</title>
  <style>
    :root {
      --page: #edf1ee;
      --ink: #eefaf1;
      --muted: rgba(238,250,241,.62);
      --deep: #0c1712;
      --green: #8ee8a8;
      --aqua: #86ddd0;
      --warm: #d9b67e;
      --bar: rgba(238,250,241,.13);
      --bar-line: rgba(238,250,241,.17);
      --shadow: 0 34px 92px rgba(13,23,19,.34);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      letter-spacing: 0;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 16% 12%, rgba(142,232,168,.15), transparent 30%),
        radial-gradient(circle at 84% 18%, rgba(134,221,208,.12), transparent 29%),
        linear-gradient(180deg, #fbfbf7 0%, var(--page) 54%, #dfe8e1 100%);
    }

    button { font: inherit; color: inherit; cursor: pointer; }

    .stage {
      width: min(1240px, 100%);
      padding: 28px clamp(14px, 4vw, 48px) 48px;
      display: grid;
      grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
      gap: clamp(24px, 5vw, 58px);
      align-items: center;
    }

    .phone {
      width: min(430px, 100%);
      margin: 0 auto;
      aspect-ratio: 390 / 844;
      padding: 10px;
      border-radius: 38px;
      background: #101612;
      box-shadow: var(--shadow);
    }

    .screen {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 38%, rgba(142,232,168,.18), transparent 22%),
        radial-gradient(circle at 50% 80%, rgba(217,182,126,.08), transparent 28%),
        linear-gradient(154deg, #0c1712 0%, #17281f 52%, #0d1813 100%);
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 42% 28%, rgba(142,232,168,.18), transparent 25%),
        radial-gradient(circle at 70% 66%, rgba(134,221,208,.10), transparent 28%);
      filter: blur(20px);
      opacity: .9;
      animation: ambient 15s ease-in-out infinite alternate;
    }

    @keyframes ambient {
      0% { transform: translate3d(-8px, 8px, 0) scale(.99); }
      100% { transform: translate3d(10px, -12px, 0) scale(1.03); }
    }

    .status {
      position: relative;
      z-index: 5;
      height: 36px;
      padding: 10px 18px 0;
      display: flex;
      justify-content: space-between;
      color: rgba(238,250,241,.72);
      font-size: 11px;
      font-weight: 730;
    }

    .top {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 24px 24px 0;
      gap: 18px;
    }

    .brand b,
    .brand span {
      display: block;
    }

    .brand b {
      font-size: 22px;
      line-height: 1;
      font-weight: 760;
    }

    .brand span {
      max-width: 250px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .enabled {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(238,250,241,.14);
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(12px);
    }

    .enabled::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(142,232,168,.11), 0 0 18px rgba(142,232,168,.55);
    }

    .presence {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 300px;
      height: 300px;
      transform: translate(-50%, -50%);
    }

    .halo {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(238,250,241,.13);
      animation: breathe 5.8s ease-in-out infinite;
    }

    .halo.outer {
      width: 274px;
      height: 274px;
    }

    .halo.mid {
      width: 202px;
      height: 202px;
      border-color: rgba(238,250,241,.12);
      animation-delay: .5s;
    }

    .orb {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 134px;
      height: 134px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 42% 34%, rgba(255,255,255,.38), transparent 11%),
        radial-gradient(circle at 54% 58%, rgba(142,232,168,.19), transparent 35%),
        radial-gradient(circle, rgba(238,250,241,.09), rgba(238,250,241,.045) 62%, transparent 66%);
      border: 1px solid rgba(238,250,241,.22);
      box-shadow:
        0 0 52px rgba(142,232,168,.16),
        inset 0 0 40px rgba(238,250,241,.06);
      backdrop-filter: blur(12px);
      animation: orb 7s ease-in-out infinite;
    }

    .orb::after {
      content: "";
      position: absolute;
      right: 32px;
      bottom: 36px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px rgba(142,232,168,.74);
    }

    @keyframes breathe {
      0%, 100% { opacity: .35; transform: translate(-50%, -50%) scale(.97); }
      50% { opacity: .82; transform: translate(-50%, -50%) scale(1.04); }
    }

    @keyframes orb {
      0%, 100% { transform: translate(-50%, -50%) scale(.985); }
      50% { transform: translate(-50%, -52%) scale(1.025); }
    }

    .hint {
      position: absolute;
      left: 26px;
      right: 26px;
      bottom: 145px;
      z-index: 5;
      min-height: 24px;
      text-align: center;
      color: rgba(238,250,241,.82);
      font-size: 13px;
      font-weight: 690;
    }

    .composer {
      position: absolute;
      left: 50%;
      bottom: 28px;
      z-index: 5;
      width: min(300px, calc(100% - 58px));
      height: 54px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
    }

    .voice {
      height: 54px;
      border: 1px solid var(--bar-line);
      border-radius: 19px;
      background: var(--bar);
      color: rgba(238,250,241,.88);
      font-size: 15px;
      font-weight: 720;
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 38px rgba(0,0,0,.16), inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .text-toggle {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(238,250,241,.13);
      border-radius: 50%;
      background: rgba(238,250,241,.09);
      color: rgba(238,250,241,.78);
      backdrop-filter: blur(14px);
    }

    .text-toggle::before {
      content: "";
      width: 16px;
      height: 13px;
      border: 1.8px solid currentColor;
      border-radius: 3px;
      box-shadow:
        -5px 6px 0 -4px currentColor,
        5px 6px 0 -4px currentColor;
    }

    .notes {
      display: grid;
      gap: 16px;
    }

    .card {
      padding: 22px;
      border: 1px solid rgba(17,29,24,.12);
      border-radius: 24px;
      background: rgba(255,255,255,.72);
      color: #111d18;
      box-shadow: 0 24px 78px rgba(17,29,24,.12);
    }

    .card h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.22;
    }

    .card p {
      margin: 9px 0 0;
      color: #647168;
      font-size: 14px;
      line-height: 1.72;
    }

    .fixes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .fix {
      min-height: 112px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(247,249,245,.9);
      border: 1px solid rgba(17,29,24,.08);
    }

    .fix b,
    .fix span {
      display: block;
    }

    .fix b { font-size: 13px; }

    .fix span {
      margin-top: 7px;
      color: #647168;
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 980px) {
      .stage { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .stage { padding: 18px 12px 36px; }
      .phone { padding: 8px; border-radius: 30px; }
      .screen { border-radius: 24px; }
      .fixes { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="Agent 首页概念 v0.6">
      <div class="screen">
        <div class="status"><span>9:41</span><span>Reality</span></div>

        <header class="top">
          <div class="brand">
            <b>在场</b>
            <span>随时待命的现实记忆 Agent。</span>
          </div>
          <i class="enabled" aria-label="已开启"></i>
        </header>

        <div class="presence" aria-hidden="true">
          <i class="halo outer"></i>
          <i class="halo mid"></i>
          <i class="orb"></i>
        </div>

        <div class="hint">2 条线索待确认</div>

        <div class="composer" role="group" aria-label="语音输入">
          <button class="voice">按住说话</button>
          <button class="text-toggle" aria-label="切换文字输入"></button>
        </div>
      </div>
    </section>

    <aside class="notes">
      <article class="card">
        <h2>v0.6 的修正</h2>
        <p>标题释义改成“随时待命的现实记忆 Agent”，先贴近你说的方向。中心回到单一光球，只保留少量深浅层次和呼吸，不再出现多种光韵。</p>
      </article>
      <article class="card">
        <h2>语音入口</h2>
        <p>输入区改成更窄的整体长按语音条，去掉左侧圆形麦克风。文字输入变成右侧单独的小图标，避免和语音主入口抢层级。</p>
        <div class="fixes">
          <div class="fix"><b>标题</b><span>“在场”暂保留，副标题明确它是现实记忆 Agent。</span></div>
          <div class="fix"><b>光球</b><span>单一光球 + 两层极淡光圈，减少杂光和雷达感。</span></div>
          <div class="fix"><b>语音条</b><span>整体长按，不再让左侧图标像唯一可按区域。</span></div>
          <div class="fix"><b>文字切换</b><span>独立小图标，不使用 Aa，也不写“输入文字”。</span></div>
        </div>
      </article>
    </aside>
  </main>
</body>
</html>
